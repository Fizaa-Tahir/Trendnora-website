<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trendora Search</title>

<style>


body {
  margin: 0;
  font-family: "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}

/* HEADER */
.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background: #fff;
  border-bottom: 1px solid #eee;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 2px;
}

.header-right input {
  width: 260px;
  padding: 10px 14px;
  border-radius: 20px;
  border: 1px solid #dcdcdc;
  font-size: 14px;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 90;
}

.overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* SIDEBAR */


.search-sidebar {
  position: fixed;
  top: 0;
  right: -460px;
  width: 460px;
  height: 100vh;
  background: #fff;
  z-index: 100;
  padding: 25px 30px;
  transition: 0.35s ease;
  overflow-y: auto;
}

.search-sidebar.active {
  right: 0;
}

/* SEARCH INPUT */
.search-header {
  display: flex;
  align-items: center;
  border: 1px solid #dcdcdc;
  padding: 12px 14px;
  border-radius: 6px;
}

.search-header input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 15px;
}

#clearSearch {
  font-size: 22px;
  cursor: pointer;
  margin-left: 10px;
}

/* SUGGESTIONS */
.suggestions {
  margin-top: 25px;
}

.suggestions h4,
.inspiration h4 {
  font-size: 14px;
  font-weight: 600;
}

.suggestions ul {
  list-style: none;
  padding: 0;
}

.suggestions li {
  font-size: 14px;
  padding: 6px 0;
  cursor: pointer;
}

/* PRODUCTS */
.inspiration {
  margin-top: 30px;
}

.inspiration-products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.inspiration-products a {
  text-decoration: none;
  color: #000;
}

.inspiration-products img {
  width: 100%;
  border-radius: 4px;
}

.inspiration-products span {
  display: block;
  font-size: 13px;
  margin-top: 6px;
}
</style>
</head>

<body>



<div class="overlay" id="overlay"></div>

<div class="search-sidebar" id="searchSidebar">
  <div class="search-header">
    <input type="text" id="sidebarSearchInput" placeholder="Find Your Favourites">
    <span id="clearSearch">×</span>
  </div>

  <div class="suggestions">
    <h4>Suggestions For You:</h4>
    <ul>
      <li>Winter '25</li>
      <li>Matching Separates</li>
      <li>Festive '25</li>
      <li>COATS | JACKETS</li>
      <li>SWEATERS | CARDIGANS</li>
    </ul>
  </div>

  <div class="inspiration">
    <h4>Need some inspiration?</h4>
    <div class="inspiration-products" id="inspirationProducts"></div>
  </div>
</div>

<script>
const mainSearchInput = document.getElementById('mainSearchInput');
const sidebar = document.getElementById('searchSidebar');
const overlay = document.getElementById('overlay');
const sidebarInput = document.getElementById('sidebarSearchInput');
const clearBtn = document.getElementById('clearSearch');
const inspContainer = document.getElementById('inspirationProducts');

mainSearchInput.addEventListener('focus', () => {
  sidebar.classList.add('active');
  overlay.classList.add('active');
  sidebarInput.focus();
});

function closeSidebar() {
  sidebar.classList.remove('active');
  overlay.classList.remove('active');
}

clearBtn.addEventListener('click', () => {
  sidebarInput.value = '';
  populateInspiration('');
});

overlay.addEventListener('click', closeSidebar);
document.addEventListener('keydown', e => {
  if (e.key === "Escape") closeSidebar();
});

const products = [
  {name:"Khaddar Printed 2pc", price:"Rs.5000", image:"pret1.webp"},
  {name:"Khaddar Floral Shirt", price:"Rs.4500", image:"pret2.webp"},
  {name:"Embroidered Linen Shirt 2pc", price:"Rs.5500", image:"pret3.webp"},
  {name:"Luxury Embroidered Shirt 2pc", price:"Rs.5000", image:"pret4.webp"}
];

function populateInspiration(query){
  inspContainer.innerHTML = '';
  products
    .filter(p => p.name.toLowerCase().includes(query.toLowerCase()))
    .forEach(p => {
      inspContainer.innerHTML += `
        <a href="#">
          <img src="${p.image}">
          <span>${p.name}<br>${p.price}</span>
        </a>`;
    });
}

sidebarInput.addEventListener('input', () => populateInspiration(sidebarInput.value));
populateInspiration('');
</script>

</body>
</html>
