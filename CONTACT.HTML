<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trendora - Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* GENERAL RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: #f9f9f9; color: #111; line-height: 1.6; }
    a { text-decoration: none; color: inherit; }

    /* HEADER */
    header {
      width: 100%; padding: 20px 50px;
      display: flex; justify-content: space-between; align-items: center;
      background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 30px; font-weight: bold; color: black; }
    header nav a { margin-left: 20px; font-weight: bold; color: #111; }
    header nav a:hover { color:black; }

    /* CONTACT SECTION */
    .contact-section {
      max-width: 1200px; margin: 50px auto; padding: 0 20px;
      display: flex; flex-wrap: wrap; gap: 50px; justify-content: space-between;
    }

    /* CONTACT FORM */
    .contact-form {
      flex: 1 1 500px;
      background: #fff; padding: 30px; border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .contact-form h2 { margin-bottom: 20px; font-size: 28px; color: #ff4d6d; }
    .contact-form input, .contact-form textarea {
      width: 100%; padding: 15px; margin-bottom: 15px;
      border: 1px solid #ddd; border-radius: 8px; outline: none; transition: 0.3s;
    }
    .contact-form input:focus, .contact-form textarea:focus {
      border-color: #ff4d6d; box-shadow: 0 0 10px rgba(255,77,109,0.2);
    }
    .contact-form button {
      padding: 15px 30px; border: none; background: #ff4d6d; color: #fff;
      border-radius: 25px; cursor: pointer; transition: 0.3s; font-size: 16px;
    }
    .contact-form button:hover { background: #ff1f4b; }

    /* CONTACT INFO */
    .contact-info {
      flex: 1 1 400px;
      background: #fff; padding: 30px; border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .contact-info h2 { margin-bottom: 20px; font-size: 28px; color: #ff4d6d; }
    .contact-info p { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .contact-info i { color: #ff4d6d; margin-right: 10px; }

    /* GOOGLE MAP */
    .contact-map { width: 100%; height: 300px; margin-top: 30px; border-radius: 10px; overflow: hidden; }

    /* FOOTER */
    footer {
      background: #111; color: #fff; padding: 40px 50px; margin-top: 50px;
      display: flex; flex-wrap: wrap; justify-content: space-between;
    }
    footer .footer-section { flex: 1 1 250px; margin-bottom: 20px; }
    footer h3 { margin-bottom: 15px; color: #ff4d6d; }
    footer p, footer a { color: #ccc; font-size: 14px; line-height: 1.6; }
    footer a:hover { color: #ff4d6d; }
    footer .social-icons a { margin-right: 15px; font-size: 18px; }

    /* RESPONSIVE */
    @media(max-width: 900px){
      .contact-section { flex-direction: column; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Trendora</div>
   <i class="fas fa-bars menu-icon"></i>
 
</header>

<!-- CONTACT SECTION -->
<section class="contact-section">

  <!-- CONTACT FORM -->
  <div class="contact-form">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <input type="text" placeholder="Subject" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- CONTACT INFO -->
  <div class="contact-info">
    <h2>Get In Touch</h2>
    <p><i class="fas fa-map-marker-alt"></i> 123 Fashion Street, Karachi, Pakistan</p>
    <p><i class="fas fa-phone"></i> +92 300 1234567</p>
    <p><i class="fas fa-envelope"></i> info@trendora.com</p>

    <!-- GOOGLE MAP -->
    <div class="contact-map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3620.123456789!2d67.0012345678!3d24.860123456!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33f56789abcdef%3A0xabcdef1234567890!2sKarachi%2C%20Pakistan!5e0!3m2!1sen!2s!4v1678901234567" 
      width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </div>

</section>

<!-- FOOTER -->
<footer>
  <div class="footer-section">
    <h3>About Trendora</h3>
    <p>Trendora brings you the latest ready-to-wear and luxury collections. Stay trendy, stay stylish.</p>
  </div>

  <div class="footer-section">
    <h3>Quick Links</h3>
    <p><a href="rtw.html">RTW Collection</a></p>
    <p><a href="unstitched.html">Unstitched</a></p>
    <p><a href="wed.html">Luxury</a></p>
    <p><a href="contact.html">Contact Us</a></p>
  </div>

  <div class="footer-section">
    <h3>Follow Us</h3>
    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-pinterest-p"></i></a>
    </div>
  </div>
</footer>

<script>
  // Simple form submit alert
  document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Thank you for contacting Trendora! We will get back to you soon.");
    this.reset();
  });
</script>

</body>
</html>
